# CI workflow for Entity Resolution Service Webapp
# =================================================
# Runs on push to develop and on PRs targeting develop.
#
# Jobs:
#   1. quality — Install, lint, typecheck, test

name: CI

on:
  push:
    branches: [develop, release/*]
    paths-ignore:
      - 'docs/**'
      - '*.md'
      - 'LICENSE'
  pull_request:
    branches: [develop]
    paths-ignore:
      - 'docs/**'
      - '*.md'
      - 'LICENSE'

permissions:
  contents: read

jobs:
  quality:
    name: Lint, Test & Verify
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: src/package-lock.json

      - name: Install dependencies
        run: make install

      # Generate API client from schema
      - name: Generate API client
        run: make generate

      # Quality checks
      - name: Lint (ESLint)
        id: lint
        run: make lint
        continue-on-error: true

      - name: Type check (TypeScript)
        id: typecheck
        run: make typecheck
        continue-on-error: true

      - name: Unit tests with coverage
        id: test
        run: make test-coverage
        continue-on-error: true

      # Fail the job if any check failed
      - name: Evaluate results
        if: always()
        run: |
          echo "Lint:       ${{ steps.lint.outcome }}"
          echo "Type check: ${{ steps.typecheck.outcome }}"
          echo "Tests:      ${{ steps.test.outcome }}"

          if [[ "${{ steps.lint.outcome }}" != "success" || \
                "${{ steps.typecheck.outcome }}" != "success" || \
                "${{ steps.test.outcome }}" != "success" ]]; then
            echo "::error::One or more quality checks failed."
            exit 1
          fi
