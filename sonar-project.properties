# SonarCloud configuration for Entity Resolution Service Webapp
# ==============================================================
# Project: https://sonarcloud.io/project/overview?id=meaningfy-ws_entity-resolution-service-webapp

sonar.projectKey=meaningfy-ws_entity-resolution-service-webapp
sonar.organization=meaningfy-ws

# Source and test paths
sonar.sources=src/
sonar.tests=src/test/

# Coverage report (vitest v8 coverage)
sonar.javascript.lcov.reportPaths=src/coverage/lcov.info

# Exclusions
sonar.coverage.exclusions=src/test/**/*
sonar.cpd.exclusions=src/test/**/*
sonar.exclusions=docs/**/*,*.md,src/infra/**/*,src/api/**/*,src/test/e2e/**/*
