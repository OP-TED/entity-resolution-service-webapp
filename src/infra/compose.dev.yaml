services:
  app:
    container_name: ers-webapp
    build:
      context: ../..
      dockerfile: src/infra/Dockerfile
      args:
        ENVIRONMENT: development
    ports:
      - '8080:8080'
    networks:
      - ersys-local
    environment:
      - API_BACKEND_URL=${API_BACKEND_URL}
      - SCORE_LEVEL_LOW_MAX=${SCORE_LEVEL_LOW_MAX:-0.4}
      - SCORE_LEVEL_MEDIUM_MAX=${SCORE_LEVEL_MEDIUM_MAX:-0.7}
    healthcheck:
      test: ['CMD', 'wget', '--spider', '-q', 'http://localhost:8080/']
      interval: 10s
      timeout: 5s
      retries: 3

networks:
  ersys-local:
    external: true
